<main class="account">

  <section class="page-header">
    <h1>My Account</h1>
  </section>

  <div class="account-container">

    <section class="card info-card">
      <h2 class="card-title">Account Details</h2>
      <div class="info-grid">
        <div class="info-field">
          <label>First name</label>
          <p>Jean</p>
        </div>
        <div class="info-field">
          <label>Last name</label>
          <p>Dupont</p>
        </div>
        <div class="info-field">
          <label>Email</label>
          <p>jean.dupont&#64;email.com</p>
        </div>
        <div class="info-field">
          <label>Phone</label>
          <p>+33 6 12 34 56 78</p>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Update account</h2>
      <div class="form-grid">
        <div class="form-field">
          <label>First name</label>
          <input type="text" placeholder="Jean" />
        </div>
        <div class="form-field">
          <label>Last name</label>
          <input type="text" placeholder="Dupont" />
        </div>
        <div class="form-field">
          <label>Email</label>
          <input type="email" placeholder="jean.dupont@email.com" />
        </div>
        <div class="form-field">
          <label>Phone</label>
          <input type="text" placeholder="+33 6 12 34 56 78" />
        </div>
      </div>
      <button class="btn-fire">Update</button>
    </section>

    <section class="card">
      <h2 class="card-title">Update password</h2>
      <div class="form-grid">
        <div class="form-field">
          <label>New password</label>
          <input type="password" placeholder="••••••••" />
        </div>
        <div class="form-field">
          <label>Confirm new password</label>
          <input type="password" placeholder="••••••••" />
        </div>
        <div class="form-field">
          <label>Actual password</label>
          <input type="password" placeholder="••••••••" />
        </div>
      </div>
      <button class="btn-fire">Update</button>
    </section>

  </div>
</main>
